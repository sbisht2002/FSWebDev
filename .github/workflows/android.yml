name: Build Call Recorder APK

# Builds the debug APK on GitHub's runners (which have the Android SDK
# preinstalled) and uploads it as a downloadable artifact.
on:
  push:
    branches: [claude/laughing-curie-966ptw]
    paths: [android-call-recorder/**, .github/workflows/android.yml]
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-call-recorder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: call-recorder-debug-apk
          path: android-call-recorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
